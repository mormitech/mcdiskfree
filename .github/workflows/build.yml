name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mcdiskfree-macos
            output: build/bin/mcdiskfree.app
          - os: ubuntu-latest
            artifact: mcdiskfree-linux
            output: build/bin/mcdiskfree
          - os: windows-latest
            artifact: mcdiskfree-windows
            output: build/bin/mcdiskfree.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      # The Go code embeds the built frontend, so it has to exist before `go vet` and `go test`.
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Tags
        id: tags
        shell: bash
        run: echo "tags=${{ runner.os == 'Linux' && 'webkit2_41' || '' }}" >> "$GITHUB_OUTPUT"
      - run: go vet -tags "${{ steps.tags.outputs.tags }}" ./...
      - run: go test -tags "${{ steps.tags.outputs.tags }}" ./...
      - run: wails build -tags "${{ steps.tags.outputs.tags }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
