<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>mcdiskfree</title>
</head>
<body>
<header>
    <button id="disks">Disks</button>
    <button id="choose">Choose folder…</button>
    <button id="rescan" disabled title="Scan everything again">Rescan</button>
    <button id="rescanfolder" hidden title="Scan only the folder shown, and keep the rest">Rescan this folder</button>
    <button id="up" title="One folder up" disabled>↑ Up</button>
    <button id="root" title="Back to the top of the scanned disk or folder" disabled>⌂ Root</button>
    <div id="cache" hidden></div>
    <div id="space" hidden></div>
</header>
<main>
    <section id="chart">
        <nav id="crumbs"></nav>
        <div id="stage"><svg id="sun"></svg><div id="center"></div></div>
    </section>
    <aside>
        <div id="list"></div>
        <div id="basket" hidden></div>
    </aside>
    <div id="splash"></div>
</main>
<div id="about" hidden></div>
<div id="tip" hidden></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
